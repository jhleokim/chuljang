<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>출장 · Chrome 연결</title><link rel="stylesheet" href="popup.css"></head><body><header><b>출장</b><span>Chrome 연결</span></header><h1>출장 날짜를 고르면<br>내역을 모아드려요.</h1><p>처음 한 번 연결하면 내역 찾기와 전송은 자동으로 이어집니다. 서비스의 기존 로그인 상태를 사용합니다.</p><section id="sources" aria-label="연결 서비스"></section><label class="startup"><input type="checkbox" id="startup"> Chrome을 열면 선택 날짜 다시 수집 <small>최근 수집 후 6시간이 지난 경우</small></label><button id="start">서비스 연결하기</button><button id="stop" class="secondary" hidden>수집 중단</button><p id="message" role="status"></p><section id="progress" aria-live="polite"></section><button id="destination" class="secondary">내 출장 영수증 보기</button><details><summary>앱 영수증과 현재 페이지</summary><p>카카오 T 개인·쏘카 개인 영수증은 앱에서 파일을 공유해야 합니다. 다른 항공사는 발급받은 PDF를 출장 화면으로 가져오세요.</p><button id="current" class="secondary">현재 영수증 바로 가져오기</button></details><footer>비밀번호·쿠키를 읽거나 전송하지 않습니다.<br>선택한 출장 날짜 · 서비스당 최대 100건 / 20개 화면<br>저장 대기 내역은 이 Chrome 세션에 30분간 보관합니다.</footer><script type="module" src="popup.js"></script></body></html>
