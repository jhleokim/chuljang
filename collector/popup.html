<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>출장 영수증 수집</title><link rel="stylesheet" href="popup.css"></head><body><h1>출장 <small>영수증 수집</small></h1><p>공식 사이트에서 영수증을 연 뒤 실행하세요. 필요한 부분을 선택하면 선택한 텍스트만 읽습니다.</p><label>서비스<select id="source"><option value="">선택해 주세요</option><option value="ktx">KTX · 코레일</option><option value="kakaot">카카오 T 거래확인증</option><option value="tmoney">티머니 · 고속버스</option><option value="airline">항공</option><option value="socar">쏘카</option></select></label><button id="collect">현재 페이지 읽기</button><p id="status" role="status"></p><section id="review" hidden><h2>전송할 내용</h2><pre id="preview"></pre><p>아래 텍스트가 본인의 출장 사이트로 전달됩니다. 비밀번호·입력 필드·쿠키는 읽지 않습니다.</p><button id="send">출장으로 보내기</button><button id="download" class="secondary">수집 파일로 저장</button></section><footer>현재 화면만 수집 · 자동 로그인·페이지 넘김 없음</footer><script src="popup.js"></script></body></html>
